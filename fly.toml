# fly.toml app configuration file generated for webcode-cloudy on 2026-11-17T04:49:35-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'webcode-cloudy'
# Run exactly ONE machine: Hocuspocus document state, presence and rate limits live in-process.
# Deploy with `fly deploy --ha=false` and keep `fly scale count 1`.
primary_region = 'iad'

[build]
[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
